name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libasound2-dev libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test

  windows:
    runs-on: windows-latest
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Stage artifact
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/gyro4u.exe dist/
          Copy-Item docs/WINDOWS.md dist/README-WINDOWS.md
      - uses: actions/upload-artifact@v4
        with:
          name: gyro4u-windows-x86_64
          path: dist/
          if-no-files-found: error
