             M 89.51 56.00 V 55.00 L 90.21 56.00 V 55.00" transform="rotate(-60 89.11 55.50)" stroke-width="0.2"/>
    <path d="M 92.25 51.61 V 50.61 L 92.70 51.26 L 93.15 50.61 V 51.61
