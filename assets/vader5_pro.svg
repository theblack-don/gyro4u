    <!-- Single-rimmed outer controller shell with pointed inner grip tips. -->
    <path d="M 58 13.5
             L 102 13.5
             C 112 14.0, 121 16.5, 129 20.0
             L 132.0 22.0
             C 140 40, 148 64, 150.5 83
             C 152.0 95, 148.5 104.5, 141.5 107.2
