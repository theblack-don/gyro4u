    <path d="M 123.5 13.7 C 122.2 9.8, 119.5 9.4, 114.0 10.2" stroke-width="0.34"/>

    <!-- Peeking inner extra-bumper tabs (LM / RM) on the inner bumper slopes. -->
    <path id="vader-lm" d="M 59.5 10.8 C 63.0 10.4, 65.5 11.2, 67.2 13.4 L 59.5 13.4 Z" stroke-width="0.32"/>
    <path id="vader-rm" d="M 100.5 10.8 C 97.0 10.4, 94.5 11.2, 92.8 13.4 L 100.5 13.4 Z" stroke-width="0.32"/>

    <!-- Subtle top-center bridge arc between the inner bumpers. -->
