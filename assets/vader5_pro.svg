<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 115" width="160" height="115">
  <!--
    Original Gyro4U illustration of the Flydigi Vader 5 Pro front.
    Crisp technical line art with single-rimmed shell, inverted V-bezel with
    winged emblem, tension-adjust stick rings with MIN/MAX micro-labels and
    36-tick angled turbine starburst wells, concave D-pad dish, and Y/X/B/A + C/Z
    front buttons. Geometry matches src/ui/vader5_layout.rs.
  -->
  <g fill="none" stroke="#e4ddd6" stroke-width="0.36" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top shoulder bumpers LB / RB and peeking trigger / extra-bumper tabs. -->
    <path id="vader-l1" d="M 31.5 20.0 L 31.5 16.5 C 37 13.0, 45 10.0, 52 9.2 C 57 9.5, 63 11.2, 67.5 13.5 C 55 13.5, 42 16.0, 31.5 20.0 Z" stroke-width="0.55"/>
    <path id="vader-r1" d="M 128.5 20.0 L 128.5 16.5 C 123 13.0, 115 10.0, 108 9.2 C 103 9.5, 97 11.2, 92.5 13.5 C 105 13.5, 118 16.0, 128.5 20.0 Z" stroke-width="0.55"/>

    <!-- Peeking outer trigger tabs (LT / RT) behind each bumper. -->
