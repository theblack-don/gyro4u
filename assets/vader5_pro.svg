             M 51.49 37.77 L 54.40 39.00" stroke-width="0.24" opacity="0.85"/>
    <circle cx="44.5" cy="39.0" r="6.4" stroke-width="0.26"/>
    <circle cx="44.5" cy="39.0" r="5.6" stroke-width="0.38"/>

    <!-- Right tension-adjust stick well at (99.5, 61.5). -->
