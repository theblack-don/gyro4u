<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 125" width="160" height="125">
  <!--
    Original Gyro4U illustration of the 8BitDo Pro 3 front.
    Monochrome line-art matching the DualSense/Steam views. Geometry matches
    src/ui/eightbitdo_layout.rs. The rear paddles PL/PR are shown dashed.
  -->
  <g fill="none" stroke="#d9dee5" stroke-width="0.34" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="80" cy="121" rx="56" ry="2.8" fill="#000000" stroke="none" opacity="0.18"/>

    <!-- L2 / R2 triggers and the top bumpers sit behind the shell edge. -->
    <g fill="#1b1e22" stroke-width="0.34">
      <rect x="28" y="2" width="34" height="10" rx="3.2"/>
      <rect x="98" y="2" width="34" height="10" rx="3.2"/>
    </g>
    <g fill="#30353c" stroke-width="0.36">
      <rect x="28" y="12" width="36" height="10" rx="3.4"/>
      <rect x="96" y="12" width="36" height="10" rx="3.4"/>
    </g>
    <g fill="#20242a" stroke-width="0.32">
      <rect x="66" y="12" width="10" height="10" rx="2.6"/>
      <rect x="84" y="12" width="10" height="10" rx="2.6"/>
    </g>

    <!-- Shell: rounded SNES-like body with a central hump and long flared grips. -->
    <path d="M27.5 22
             C36 19.4 46 18.4 56 18.2
             C64 18.1 70 17.4 80 17.2
             C90 17.4 96 18.1 104 18.2
             C114 18.4 124 19.4 132.5 22
             C139 24.7 141.8 31.2 143 39.5
             C144.8 50.5 146.2 61 146 71
             C145.9 81 145.4 91.5 144 100.5
             C142.5 110.2 139.2 117.6 133.5 118
             C129.4 118.3 126 115.3 123.4 110.4
             C120.4 104.8 118.6 99 116.4 94.4
             C114.6 91.2 112.4 89.6 109.4 89.2
             C99.6 88.4 89.8 86.5 80 86.5
             C70.2 86.5 60.4 88.4 50.6 89.2
             C47.6 89.6 45.4 91.2 43.6 94.4
             C41.4 99 39.6 104.8 36.6 110.4
             C34 115.3 30.6 118.3 26.5 118
             C20.8 117.6 17.5 110.2 16 100.5
             C14.6 91.5 14.1 81 14 71
             C13.8 61 15.2 50.5 17 39.5
             C18.2 31.2 21 24.7 27.5 22 Z"
          fill="#25292f" stroke-width="0.44"/>

    <!-- USB-C port and status LED between the extra bumpers. -->
    <rect x="77" y="18.2" width="6" height="2" rx="1"
          fill="#171a1e" stroke="#6f7781" stroke-width="0.22"/>
    <circle cx="80" cy="21.7" r="0.7" fill="#d9dee5" stroke="none" opacity="0.85"/>

    <!-- Raised centre panel. -->
    <rect x="65" y="30.5" width="30" height="27.5" rx="8.5"
          stroke="#6f7781" stroke-width="0.22" opacity="0.45"/>

    <!-- D-pad well and cross. -->
    <circle cx="46" cy="41" r="11.5" fill="#1d2126" stroke="#6f7781" stroke-width="0.3"/>
    <path d="M41.75 30.5 H50.25 V36.75 H56.5 V45.25 H50.25 V51.5 H41.75 V45.25 H35.5 V36.75 H41.75 Z"
          fill="#30353c" stroke-width="0.4"/>
    <path d="M42.95 31.7 H49.05 V37.95 H55.3 V44.05 H49.05 V50.3 H42.95 V44.05 H36.7 V37.95 H42.95 Z"
          stroke="#6f7781" stroke-width="0.22" opacity="0.55"/>
    <circle cx="46" cy="41" r="1.3" fill="#171a1e" stroke="#6f7781" stroke-width="0.2"/>

    <!-- Left stick. -->
    <circle cx="56" cy="71" r="10.5" fill="#1b1e22" stroke-width="0.4"/>
    <circle cx="56" cy="71" r="9.2" fill="#20242a" stroke-width="0.36"/>
    <circle cx="56" cy="71" r="7.6" stroke="#6f7781" stroke-width="0.26"
            stroke-dasharray="0.9 1.1" opacity="0.65"/>
    <circle cx="56" cy="71" r="5.6" fill="#171a1e" stroke="#6f7781" stroke-width="0.28"/>
    <path d="M52.3 66.9 C53.8 65.8 55.8 65.4 57.6 65.7"
          stroke="#8b939d" stroke-width="0.36" opacity="0.5"/>

    <!-- Right stick. -->
    <circle cx="104" cy="71" r="10.5" fill="#1b1e22" stroke-width="0.4"/>
    <circle cx="104" cy="71" r="9.2" fill="#20242a" stroke-width="0.36"/>
    <circle cx="104" cy="71" r="7.6" stroke="#6f7781" stroke-width="0.26"
            stroke-dasharray="0.9 1.1" opacity="0.65"/>
    <circle cx="104" cy="71" r="5.6" fill="#171a1e" stroke="#6f7781" stroke-width="0.28"/>
    <path d="M100.3 66.9 C101.8 65.8 103.8 65.4 105.6 65.7"
          stroke="#8b939d" stroke-width="0.36" opacity="0.5"/>

    <!-- ABXY face buttons, Xbox positions: Y top, X left, B right, A bottom. -->
    <g fill="#20242a" stroke-width="0.38">
      <circle cx="114" cy="30" r="5.4"/>
      <circle cx="103" cy="41" r="5.4"/>
      <circle cx="125" cy="41" r="5.4"/>
      <circle cx="114" cy="52" r="5.4"/>
    </g>

    <!-- Create / Options pills between the sticks. -->
    <g fill="#20242a" stroke-width="0.3">
      <rect x="68" y="36" width="10" height="5" rx="2.5"/>
      <rect x="82" y="36" width="10" height="5" rx="2.5"/>
    </g>

    <!-- Home button centered below the pills. -->
    <circle cx="80" cy="49" r="6" fill="#20242a" stroke-width="0.36"/>
    <circle cx="80" cy="49" r="4.7" stroke="#6f7781" stroke-width="0.24" opacity="0.8"/>
    <path d="M77.2 49.5 L80 46.9 L82.8 49.5 V52.1 H81.1 V50.2 H78.9 V52.1 H77.2 Z"
          fill="#d9dee5" stroke="none" opacity="0.9"/>

    <!-- PL / PR rear paddles on the back of each grip. Dashed = rear. -->
    <g fill="#1b1e22" fill-opacity="0.55" stroke-width="0.42" stroke-dasharray="2 1.4">
      <rect x="22" y="92" width="14" height="16" rx="3.4"/>
      <rect x="124" y="92" width="14" height="16" rx="3.4"/>
    </g>
  </g>
</svg>
